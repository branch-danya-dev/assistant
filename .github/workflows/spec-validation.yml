name: Contracts and local runtime
on:
  push:
  pull_request:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and declared development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate contracts, coverage and schema fixtures
        run: python tools/validate_specs.py
      - name: Run unit, security, crash and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Check Python source
        run: python -m ruff check src tests setup.py
      - name: Build distributable with canonical contracts
        run: python -m pip wheel . --no-deps --wheel-dir dist
