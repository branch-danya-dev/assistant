name: Spec validation
on:
  push:
  pull_request:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validation dependency
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Validate contracts, coverage and schema fixtures
        run: python tools/validate_specs.py
      - name: Run bootstrap tests
        run: python -m unittest discover -s tests -v
